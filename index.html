<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spy vs. Spy Soundboard</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #0a0a0a;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .soundboard-container {
      background: #111111;
      padding: 28px;
      border-radius: 12px;
      color: #ffffff;
      width: 100%;
      max-width: 850px;
      border: 1px solid #222222;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .soundboard-container h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 18px;
      letter-spacing: 3px;
      color: #00ffcc;
      text-transform: uppercase;
      text-align: center;
    }

    .loader-status {
      font-size: 11px;
      color: #888888;
      text-align: center;
      margin-bottom: 16px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .control-bar {
      display: flex;
      justify-content: center;
      margin-bottom: 22px;
    }

    .stop-btn {
      background: #2a1111;
      color: #ff5555;
      border: 1px solid #ff3333;
      padding: 12px 28px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      transition: all 0.15s ease-in-out;
      user-select: none;
    }

    .stop-btn:hover {
      background: #ff3333;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 51, 51, 0.5);
    }

    .stop-btn:active {
      transform: scale(0.95);
    }

    .soundboard-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .sound-btn {
      background: #181818;
      color: #555555;
      border: 1px solid #252525;
      padding: 16px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      text-align: center;
      transition: all 0.15s ease-in-out;
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sound-btn.cached {
      color: #dddddd;
      border-color: #333333;
      background: #1c1c1c;
    }

    .sound-btn.cached:hover {
      background: #00ffcc;
      color: #000000;
      border-color: #00ffcc;
      font-weight: bold;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
    }

    .sound-btn.playing {
      background: #00ffcc !important;
      color: #000000 !important;
      border-color: #00ffcc !important;
      font-weight: bold;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
    }

    .sound-btn:active {
      transform: scale(0.96);
    }

    @media (max-width: 700px) {
      .soundboard-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 450px) {
      .soundboard-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

<div class="soundboard-container">
  <h1>SPY VS. SPY // SOUNDBOARD</h1>
  <div id="loader-status" class="loader-status">Pre-caching audio files...</div>
  
  <div class="control-bar">
    <button id="stop-all-btn" class="stop-btn">⏹ STOP ALL</button>
  </div>

  <div class="soundboard-grid">
    <button class="sound-btn" data-src="./DATA_00000.wav">🙀 Yeoww</button>
    <button class="sound-btn" data-src="./DATA_00149.wav">💻 Hack & Break</button>
    <button class="sound-btn" data-src="./DATA_00164.wav">🕳️ Spy Hole</button>
    <button class="sound-btn" data-src="./DATA_00174.wav">🔑 Ignition</button>
    <button class="sound-btn" data-src="./DATA_00189.wav">🚗 Engine Starting</button>
    <button class="sound-btn" data-src="./DATA_00200.wav">⌨️ Typing</button>
    <button class="sound-btn" data-src="./DATA_00212.wav">🔫 Laser</button>
    <button class="sound-btn" data-src="./DATA_00221.wav">⏲️ Bom Timer</button>
    <button class="sound-btn" data-src="./DATA_00250.wav">🐒 Monkey Laugh</button>
    <button class="sound-btn" data-src="./DATA_00252.wav">😈 Mwahahaha</button>
    <button class="sound-btn" data-src="./DATA_00264.wav">🚪 Electronic Door</button>
    <button class="sound-btn" data-src="./DATA_00271.wav">📡 Scanning</button>
    <button class="sound-btn" data-src="./DATA_00275.wav">🛎️ Bell</button>
    <button class="sound-btn" data-src="./DATA_00295.wav">🦹 Evil Laugh</button>
    <button class="sound-btn" data-src="./DATA_00301.wav">🗣️ Chatter</button>
    <button class="sound-btn" data-src="./DATA_00329.wav">⚡ Electrocution</button>
    <button class="sound-btn" data-src="./DATA_00386.wav">🚁 Helicopter Leave</button>
    <button class="sound-btn" data-src="./DATA_00402.wav">💥 Bomb/Boom</button>
    <button class="sound-btn" data-src="./DATA_00405.wav">🐣 Chirp</button>
    <button class="sound-btn" data-src="./DATA_00408.wav">🌀 Spring</button>
    <button class="sound-btn" data-src="./DATA_00416.wav">📞 Phone Dial</button>
    <button class="sound-btn" data-src="./DATA_00418.wav">💧 Plonk</button>
    <button class="sound-btn" data-src="./DATA_00419.wav">🚰 Valve/Yell</button>
    <button class="sound-btn" data-src="./DATA_00424.wav">💥 Pew-Gun</button>
    <button class="sound-btn" data-src="./DATA_00425.wav">📢 Bike Horn</button>
  </div>
</div>

<script>
  const activeAudioMap = new Map();
  const buttons = document.querySelectorAll('.sound-btn');
  const stopBtn = document.getElementById('stop-all-btn');
  const statusEl = document.getElementById('loader-status');
  let loadedCount = 0;

  buttons.forEach(button => {
    const url = button.dataset.src;
    
    const preloadAudio = new Audio();
    preloadAudio.src = url;
    preloadAudio.preload = 'auto';

    preloadAudio.addEventListener('canplaythrough', () => {
      if (!button.classList.contains('cached')) {
        button.classList.add('cached');
        loadedCount++;
        if (loadedCount === buttons.length) {
          statusEl.textContent = "All sounds cached // Ready";
          statusEl.style.color = "#00ffcc";
        } else {
          statusEl.textContent = `Pre-caching audio: ${loadedCount}/${buttons.length}`;
        }
      }
    }, { once: true });

    preloadAudio.load();

    button.addEventListener('click', () => {
      if (activeAudioMap.has(button)) {
        const audio = activeAudioMap.get(button);
        audio.pause();
        audio.currentTime = 0;
        activeAudioMap.delete(button);
        button.classList.remove('playing');
        return;
      }

      const audio = new Audio(url);
      activeAudioMap.set(button, audio);
      button.classList.add('playing');

      audio.play().catch(err => {
        console.error("Playback failed:", err);
        activeAudioMap.delete(button);
        button.classList.remove('playing');
      });

      audio.addEventListener('ended', () => {
        activeAudioMap.delete(button);
        button.classList.remove('playing');
      });
    });
  });

  stopBtn.addEventListener('click', () => {
    activeAudioMap.forEach((audio, button) => {
      audio.pause();
      audio.currentTime = 0;
      button.classList.remove('playing');
    });
    activeAudioMap.clear();
  });
</script>
</body>
</html>
